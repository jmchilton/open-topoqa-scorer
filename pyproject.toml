[project]
name = "open-topoqa-scorer"
version = "0.0.1"
description = "Open clean-room retrain of the TopoQA ProteinGAT interface-quality scorer (from the paper spec)."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "torch",
    "torch-geometric",
    "biopython",
    "open-topoqa-featurizer",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_topoqa_scorer"]

[tool.uv.sources]
open-topoqa-featurizer = { path = "../open-topoqa-featurizer", editable = true }

[dependency-groups]
dev = ["pytest"]
